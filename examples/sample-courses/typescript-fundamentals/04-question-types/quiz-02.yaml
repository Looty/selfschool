  - id: q08-1
    type: mcq
    text: "Which of these are primitive types?"
    concepts: [primitives]
    options:
      - {text: "string", correct: true, explanation: "A primitive: an immutable value, not an object."}
      - {text: "bigint", correct: true, explanation: "A primitive added for integers beyond the safe range of number."}
      - {text: "object", correct: false, explanation: "The `object` type means any non-primitive value."}
      - {text: "unknown", correct: false, explanation: "The top type: any value can be assigned to it, but it is not a primitive itself."}
