title: יסודות TypeScript
short_intro: הטיפוסים שבאמת משתמשים בהם, צמצום טיפוסים וג'נריקס, ב-12 שיעורים קצרים.
description: |
  קורס קצר למפתחים שכבר כותבים JavaScript. תלמדו איך המהדר מסיק טיפוסים, איך **צמצום
  טיפוסים** (narrowing) הופך איחוד לטיפוס מדויק בתוך כל ענף, ואיך ג'נריקס שומרים על קוד
  שאפשר לעשות בו שימוש חוזר בלי לאבד מידע על הטיפוסים.

  דרישות קדם: JavaScript בסיסי (פונקציות, אובייקטים, מערכים).
chapters:
  01-basics: הטיפוסים שבאמת משתמשים בהם
  02-narrowing: צמצום טיפוסים ואיחודים
  03-generics: ג'נריקס
  04-question-types: סוגי שאלות (הדגמה)
lessons:
  l04: צמצום טיפוסים עם typeof
